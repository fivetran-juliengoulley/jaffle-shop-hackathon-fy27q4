models:
  - name: stg_sales_sf
    description: Active sales records cleaned from the Oracle HVA 001 Fivetran source, one row per sale.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sale_amount >= 0"
    config:
      contract:
        enforced: true
    columns:
      - name: sale_id
        description: The unique identifier for the sale.
        data_type: integer
        data_tests:
          - not_null
          - unique
      - name: sale_date
        description: The date on which the sale occurred.
        data_type: date
        data_tests:
          - not_null
      - name: sale_amount
        description: The sale amount in the source currency.
        data_type: numeric(18,2)
        data_tests:
          - not_null
      - name: synced_at
        description: The timestamp when Fivetran synchronized the source record.
        data_type: TIMESTAMP_LTZ
